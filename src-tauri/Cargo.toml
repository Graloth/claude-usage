[package]
name = "claude-usage"
version.workspace = true
description = "Cross-platform tray app showing Claude plan limits and usage"
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
# The `_lib` suffix keeps the library name distinct from the binary on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "claude_usage_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
claude-usage-core = { path = "../crates/core" }
tauri = { version = "2.12", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-notification = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
