[package]
name = "claude-usage"
version = "0.1.0"
description = "Cross-platform tray app showing Claude plan limits and usage"
authors = ["Dion Jensen"]
license = "GPL-2.0-or-later"
edition = "2024"
rust-version = "1.99"

[lib]
# The `_lib` suffix keeps the library name distinct from the binary on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "claude_usage_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
